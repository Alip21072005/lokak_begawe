name: Deploy Laravel Vite to Rumahweb

on:
  push:
    branches:
      - main # Sesuaikan jika kamu menggunakan branch 'master'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4.33' # Sesuaikan dengan versi PHP di cPanel kamu

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0' # Sesuaikan dengan versi Node.js yang kamu pakai

      - name: Install NPM Dependencies & Build Vite
        run: |
          npm install
          npm run build

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Direktori tujuan sudah diatur saat membuat akun FTP di cPanel, jadi biarkan '/'
          server-dir: /
          # Kecualikan file mentah dan file spesifik git agar proses upload lebih cepat
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            storage/**
            .env.example
